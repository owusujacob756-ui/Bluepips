name: Provider Comparison

on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma-separated providers to run (openai,anthropic,gemini) or "all"'
        required: false
        default: 'all'

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Run provider comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GEMINI_KEY: ${{ secrets.GOOGLE_GEMINI_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          AI_PROVIDER: ${{ github.event.inputs.providers }}
        run: |
          echo "Running provider comparison (providers=${{ github.event.inputs.providers }})"
          node scripts/compare_providers.mjs || true
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-compare-results
          path: |
            scripts/compare_results.json
            scripts/compare_results_stub.json
            scripts/compare_results_*.json
